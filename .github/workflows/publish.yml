# sanjae-apply 게시 — npm 신뢰 게시(Trusted Publishing, OIDC) + MCP 레지스트리(GitHub OIDC). RELEASE.md 3·5단계를 대신한다.
# 저장된 토큰이 없다. `v<버전>` 태그를 푸시할 때만 돈다(master 병합으로는 게시하지 않는다).
# ★ 파일 이름 `publish.yml` 은 npmjs.com sanjae-apply 설정의 Trusted Publisher 에 등록하는 값이다 — 바꾸면 게시가 막힌다.
name: publish sanjae-apply

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm 신뢰 게시·출처 증명·MCP 레지스트리 OIDC 로그인

concurrency:
  group: publish-sanjae-apply
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npm 11 (신뢰 게시는 npm 11.5.1 이상)
        run: npm install -g npm@11 && npm --version

      - name: 태그와 package.json·server.json 버전이 같은지
        run: |
          V=$(node -p "require('./package.json').version")
          S=$(node -p "require('./server.json').version")
          echo "tag=$GITHUB_REF_NAME package=$V server=$S"
          test "$GITHUB_REF_NAME" = "v$V"
          test "$S" = "$V"

      - name: 설치
        run: npm ci

      - name: 빌드·시험
        run: npm run build && npx vitest run

      - name: npm 게시(신뢰 게시·출처 증명)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "sanjae-apply@$V" version >/dev/null 2>&1; then
            echo "sanjae-apply@$V 는 이미 게시됨 — 건너뛴다(레지스트리 단계만 다시 돌 때)"
          else
            npm publish --provenance --access public
          fi

      - name: MCP 레지스트리 등록
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # 새 판이 npm 조회에 보이기까지 3분 넘게 걸린 적이 있다(261125 k-labor 0.3.2) — 최대 10분 기다린다
          for i in $(seq 1 20); do
            ./mcp-publisher publish server.json && exit 0
            echo "npm 반영 대기 후 재시도 ($i)"; sleep 30
          done
          exit 1
